<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接高德地图 · 场地 Atlas</title><link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="/style.css"></head>
<body class="settings-page"><main class="settings-card"><a class="settings-brand" href="/">场地 <em>Atlas</em><span>本机配置</span></a><span class="eyebrow">CONNECT YOUR MAP</span><h1>让场地，落在地图上。</h1><p class="settings-lead">填写你刚创建的网页地图凭证。保存后即可搜索地点、圈定场地，调整城市展示范围。</p>
<form id="settingsForm" autocomplete="off"><label for="mapKey">Web 端（JS API）Key</label><input id="mapKey" type="password" required minlength="32" maxlength="32" spellcheck="false" autocomplete="new-password" placeholder="粘贴 32 位 Key"><label for="securityCode">安全密钥</label><input id="securityCode" type="password" required minlength="32" maxlength="32" spellcheck="false" autocomplete="new-password" placeholder="粘贴对应的安全密钥"><p class="credential-note">仅保存在这台电脑的本地配置中。安全密钥由本机服务转发，不写入网页代码或项目备份。</p><p id="settingsStatus" class="settings-status" role="status">正在检查本机配置…</p><button id="saveConfig" type="submit" class="primary-btn full">保存并打开地图 <span>↗</span></button></form>
<div class="settings-links"><a href="https://console.amap.com/dev/key/app" target="_blank" rel="noreferrer">打开高德控制台 ↗</a><button id="removeConfig" hidden type="button">移除本机凭证</button><a href="/">返回工作台</a></div><details><summary>填好后仍然无法连接？</summary><p>确认服务平台是「Web 端（JS API）」，Key 与安全密钥来自同一条记录。如果配置了域名白名单，需要允许当前本机地址；页面会显示地图服务返回的错误提示。</p></details></main><script type="module" src="/settings.js"></script></body></html>
